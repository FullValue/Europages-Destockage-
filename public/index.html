<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compack</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#f4f5f7;color:var(--ink);display:grid;place-items:center;padding:32px 16px}
h1{text-align:center;font-size:clamp(28px,4vw,40px);letter-spacing:-1px;margin:0 0 8px}p.s{text-align:center;color:#64748b;margin:0 0 32px}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,280px));gap:16px}
a{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:18px;padding:26px;box-shadow:0 2px 10px rgba(15,23,42,.06);border-top:5px solid var(--c);transition:transform .15s}
a:hover{transform:translateY(-4px)}a b{display:block;font-size:20px;margin:10px 0 6px}a span{color:#64748b;font-size:14px}a i{font-style:normal;font-size:30px}
@media(max-width:860px){.g{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Compack</h1><p class="s">Deux sites, un seul stock.</p>
<div class="g">
<a href="/destock/" style="--c:#f2541b"><i>📦</i><b>Compack Destock</b><span>Vente en gros aux professionnels : lots, demandes de devis.</span></a>
<a href="/market/" style="--c:#0f766e"><i>🛒</i><b>Compack Market</b><span>Boutique détail grand public : panier, commande, suivi.</span></a>
<a href="/admin/" style="--c:#0f172a"><i>⚙️</i><b>Back-office</b><span>Stock, commandes, devis, clients et messages des deux sites.</span></a>
</div></main></body></html>
